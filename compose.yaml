name: edi-bridge

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: edi_bridge
      POSTGRES_PASSWORD: edi_bridge
      POSTGRES_DB: edi_bridge
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U edi_bridge -d edi_bridge']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2-alpine3.23
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # atmoz/sftp publishes no versioned tags, so the image is pinned by digest.
  sftp:
    image: atmoz/sftp:alpine@sha256:7e439fabeae536fa254340724c042e11999924d906417dbb5c73602ad518813f
    platform: linux/amd64
    command: edi_bridge:edi_bridge:::upload
    ports:
      - '${SFTP_PORT:-2222}:22'
    volumes:
      - sftp-data:/home/edi_bridge
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 22']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [full-stack]
    image: edi-bridge/api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://edi_bridge:edi_bridge@postgres:5432/edi_bridge
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: [full-stack]
    image: edi-bridge/worker
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      WORKER_HEALTH_PORT: 3002
    ports:
      - '${WORKER_HEALTH_PORT:-3002}:3002'
    depends_on:
      redis:
        condition: service_healthy

  web:
    profiles: [full-stack]
    image: edi-bridge/web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  postgres-data:
  redis-data:
  sftp-data:
