name: CI

on:
  pull_request:
  # Fills the Turbo cache on main, which every new branch can restore.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Each job gets its own runner, so the story tests don't compete with the builds for CPU.
jobs:
  tasks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint and check-types
            job: lint
            tasks: lint check-types
          - name: Test
            job: test
            tasks: test
            # Story tests run in Vitest browser mode.
            chromium: 'true'
          - name: Build
            job: build
            tasks: build build-storybook
          - name: E2E test
            job: e2e
            tasks: test:e2e
            chromium: 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # --affected compares against the base branch, which needs the full history.
          fetch-depth: 0
          filter: blob:none

      - name: Set up
        uses: ./.github/actions/setup
        with:
          job: ${{ matrix.job }}
          chromium: ${{ matrix.chromium || 'false' }}

      # Main runs every task, so its cache covers every package.
      - name: Run affected tasks
        run: pnpm turbo run ${{ matrix.tasks }} ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  # The main ruleset requires this check name.
  checks:
    name: Lint, check-types, test and build
    if: always()
    needs: tasks
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every task job to pass
        run: test "${{ needs.tasks.result }}" = success
