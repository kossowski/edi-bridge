name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tasks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint and check-types
            job: lint
            tasks: lint check-types
          - name: Test
            job: test
            tasks: test
            chromium: 'true'
          - name: Canvas stories 1/3
            job: canvas-1
            tasks: test:canvas
            args: -- --shard=1/3
            chromium: 'true'
          - name: Canvas stories 2/3
            job: canvas-2
            tasks: test:canvas
            args: -- --shard=2/3
            chromium: 'true'
          - name: Canvas stories 3/3
            job: canvas-3
            tasks: test:canvas
            args: -- --shard=3/3
            chromium: 'true'
          - name: Build
            job: build
            tasks: build build-storybook
          - name: E2E test
            job: e2e
            tasks: test:e2e
            chromium: 'true'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # --affected compares against the base branch, which needs the full history.
          fetch-depth: 0
          filter: blob:none

      - name: Set up
        uses: ./.github/actions/setup
        with:
          job: ${{ matrix.job }}
          chromium: ${{ matrix.chromium || 'false' }}

      - name: Run affected tasks
        run: pnpm turbo run ${{ matrix.tasks }} ${{ github.event_name == 'pull_request' && '--affected' || '' }} ${{ matrix.args }}

  checks:
    name: CI passed
    if: always()
    needs: tasks
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every task job to pass
        run: test "${{ needs.tasks.result }}" = success
