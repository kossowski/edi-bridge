name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan affected jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      full-stack: ${{ steps.plan.outputs.full-stack }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Select affected jobs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MATRIX: |
            [
              { "name": "Lint and check-types", "job": "lint", "tasks": "lint check-types" },
              { "name": "Test", "job": "test", "tasks": "test", "args": "--concurrency=1" },
              { "name": "Stories", "job": "stories", "tasks": "test:stories", "chromium": "true" },
              { "name": "Canvas stories 1/3", "job": "canvas-1", "tasks": "test:canvas", "args": "-- --shard=1/3", "chromium": "true" },
              { "name": "Canvas stories 2/3", "job": "canvas-2", "tasks": "test:canvas", "args": "-- --shard=2/3", "chromium": "true" },
              { "name": "Canvas stories 3/3", "job": "canvas-3", "tasks": "test:canvas", "args": "-- --shard=3/3", "chromium": "true" },
              { "name": "Build", "job": "build", "tasks": "build build-storybook" },
              { "name": "E2E test", "job": "e2e", "tasks": "test:e2e", "chromium": "true" }
            ]
        run: .github/scripts/plan-affected-jobs.sh

  tasks:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out code
        if: ${{ !matrix.skip }}
        uses: actions/checkout@v7
        with:
          # --affected compares against the base branch, which needs the full history.
          fetch-depth: 0
          filter: blob:none

      - name: Set up
        if: ${{ !matrix.skip }}
        uses: ./.github/actions/setup
        with:
          job: ${{ matrix.job }}
          chromium: ${{ matrix.chromium || 'false' }}

      - name: Run affected tasks
        if: ${{ !matrix.skip }}
        run: pnpm turbo run ${{ matrix.tasks }} ${{ github.event_name == 'pull_request' && '--affected' || '' }} ${{ matrix.args }}

  full-stack-e2e:
    name: Full-stack E2E test
    needs: plan
    if: needs.plan.outputs.full-stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPERATOR_EMAIL: operator@example.com
      OPERATOR_PASSWORD: full-stack-ci-operator-password
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup
        with:
          job: full-stack-e2e
          chromium: 'true'

      - name: Start the full-stack profile
        run: docker compose --profile full-stack up -d --build --wait --wait-timeout 180

      - name: Create the Operator
        run: >-
          docker compose --profile full-stack exec -T -e OPERATOR_PASSWORD api
          node dist/create-operator.js --email "$OPERATOR_EMAIL" --name Operator --workspace "Full-stack E2E"

      - name: Run the full-stack E2E test
        run: pnpm turbo run test:e2e:full-stack --filter=@edi-bridge/web

      - name: Upload the Playwright traces
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: full-stack-e2e-test-results
          path: apps/web/test-results
          if-no-files-found: ignore

      - name: Print the Compose logs
        if: failure() || cancelled()
        run: docker compose --profile full-stack logs --no-color --timestamps

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up
        uses: ./.github/actions/setup
        with:
          job: format

      - name: Check formatting
        run: pnpm format:check

  checks:
    name: CI passed
    if: always()
    needs: [plan, tasks, full-stack-e2e, format]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the plan, task, full-stack E2E and format jobs to pass
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TASKS_RESULT: ${{ needs.tasks.result }}
          FULL_STACK_E2E_RESULT: ${{ needs.full-stack-e2e.result }}
          FORMAT_RESULT: ${{ needs.format.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$FORMAT_RESULT" = success
          test "$TASKS_RESULT" = success || test "$TASKS_RESULT" = skipped
          test "$FULL_STACK_E2E_RESULT" = success || test "$FULL_STACK_E2E_RESULT" = skipped
